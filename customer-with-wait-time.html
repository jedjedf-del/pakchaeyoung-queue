
<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>พัคแชยอง | ดูคิวออนไลน์</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#f3dfaa;font-family:system-ui,sans-serif;padding:20px}
main{max-width:520px;margin:auto}
h1{text-align:center;font-size:28px}
.sub{text-align:center;color:#ccc}
.card{border:1px solid #b99a50;border-radius:18px;padding:22px;margin:18px 0}
.label{color:#ccc}
.big{font-size:52px;font-weight:bold;margin:12px 0}
.num{font-size:34px;font-weight:bold}
.item{background:#242424;border-radius:12px;padding:15px;margin:9px 0}
.waittime{color:#f3dfaa;font-size:23px;font-weight:700;margin-top:9px}
.hint{color:#aaa;font-size:13px;margin-top:5px}
.status{background:#29251c;padding:14px;border-radius:12px;text-align:center}
small{color:#aaa}
</style>
</head>
<body>
<main>
<h1>♛ พัคแชยอง Hair Studio</h1>
<p class="sub">ระบบตรวจสอบคิวออนไลน์</p>
<div class="status" id="status">กำลังเชื่อมต่อ...</div>

<div class="card">
<div class="label">คิวที่กำลังให้บริการ</div>
<div class="big" id="current">—</div>
<div class="label">จำนวนคิวที่รอ</div>
<div class="num" id="count">—</div>
<div class="hint" id="timingStatus"></div>
</div>

<div class="card">
<h2>รายการคิวที่รอ</h2>
<div id="queue">กำลังโหลดข้อมูล...</div>
</div>

<p class="sub">รับบัตรคิวได้ที่หน้าร้านเท่านั้น</p>
<p class="sub">เปิด 10:00–21:00 น. | หยุดวันจันทร์</p>
<p class="sub"><small>เวลาและลำดับคิวอาจเปลี่ยนแปลงตามการให้บริการจริง</small></p>
</main>

<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {getFirestore,doc,onSnapshot} from
"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const app=initializeApp({
 projectId:"pakchaeyoung-queue"
});
const db=getFirestore(app);
const el=id=>document.getElementById(id);
const number=n=>String(n).padStart(3,"0");
let latest=null;
const minutesRemaining=x=>{
 const duration=Number(x?.minutes)||35;
 const start=Number(x?.startedAt);
 if(!Number.isFinite(start)||start<=0)return duration;
 return Math.max(0,duration-Math.floor((Date.now()-start)/60000));
};
function render(){
 const s=latest;
 if(!s)return;
 const today=new Date().toLocaleDateString("en-CA");
 if(!s.day){
  el("status").textContent="ยังไม่มีข้อมูลคิวของวันนี้";
  el("current").textContent="—";el("count").textContent="0";
  el("queue").textContent="ยังไม่มีคิว";el("timingStatus").textContent="";
  return;
 }
 el("status").textContent=s.closed?"ปิดรับคิววันนี้":s.paused?"พักชั่วคราว":"เปิดรับคิว";
 el("current").textContent=s.current==null?"—":number(s.current);
 const items=Array.isArray(s.items)?s.items:[];
 const waiting=items.filter(x=>x.state==="waiting")
  .sort((a,b)=>(a.priority||0)-(b.priority||0)||a.n-b.n);
 el("count").textContent=waiting.length;
 const current=items.find(x=>x.n===s.current);
 const overdue=!!(current?.startedAt && Date.now()-Number(current.startedAt)>(Number(current.minutes)||35)*60000);
 el("timingStatus").textContent=s.paused?"ร้านกำลังพัก • เวลารออาจเพิ่มขึ้น":overdue?"คิวปัจจุบันใช้เวลาเกินประมาณการ • เวลารออาจเพิ่มขึ้น":"เวลารอเป็นเพียงการประมาณการ";
 el("queue").replaceChildren();
 if(!waiting.length)el("queue").textContent="ยังไม่มีคิวรอ";
 let ahead=current?minutesRemaining(current):0;
 for(const x of waiting){
  const d=document.createElement("div");d.className="item";
  const title=document.createElement("div");title.textContent="คิว "+number(x.n)+" — รอเรียก";
  const time=document.createElement("div");time.className="waittime";
  time.textContent=(s.paused?"อย่างน้อยประมาณ ":"ประมาณ ")+ahead+" นาที";
  const hint=document.createElement("div");hint.className="hint";
  hint.textContent=s.paused?"กำลังพัก เวลารอจริงอาจนานขึ้น":overdue?"คิวปัจจุบันเกินเวลาแล้ว อาจต้องรอนานขึ้น":"เวลารอโดยประมาณ • ปรับทุก 1 นาที";
  d.append(title,time,hint);el("queue").appendChild(d);
  ahead+=Number(x.minutes)||35;
 }
}
setInterval(render,15000);

onSnapshot(doc(db,"shopQueue","main"),snap=>{
 if(!snap.exists()){
  latest=null;el("status").textContent="ยังไม่มีข้อมูลคิว";
  el("current").textContent="—";el("count").textContent="0";
  el("queue").textContent="ยังไม่มีคิว";return;
 }
 latest=snap.data();render();
},err=>{
 latest=null;
 el("status").textContent="ยังอ่านข้อมูลคิวไม่ได้";
 el("queue").textContent="กรุณาตรวจสอบการเชื่อมต่อและสิทธิ์ Firebase";
 console.error(err);
});
</script>
</body>
</html>
