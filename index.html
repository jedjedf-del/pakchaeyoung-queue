<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>พัคแชยอง | ระบบคิว</title><style>body{background:#101010;color:#f3dfaa;font-family:system-ui;margin:0;padding:18px;max-width:680px;margin:auto}h1{text-align:center}button{background:#c9a653;color:#161616;border:0;border-radius:9px;padding:13px;margin:5px;font-size:16px;font-weight:bold}button:disabled{opacity:.4}.card{border:1px solid #a88a47;border-radius:14px;padding:15px;margin:12px 0}small{color:#ddd}select{padding:8px}li{margin:10px 0;color:white}</style><h1>♛ พัคแชยอง Hair Studio</h1><p style="text-align:center">ระบบจัดการคิวทดลอง • ใช้บนมือถือเครื่องนี้</p><div class="card"><h2 id="status"></h2><div id="summary"></div><button onclick="issue()">+ ออกบัตรคิว</button><button onclick="start()">เรียกคิวถัดไป</button><button onclick="finish()">ตัดเสร็จ</button><button onclick="skip()">ข้ามคิว</button></div><div class="card"><h3>ระยะเวลาคิวที่กำลังตัด</h3><select id="duration" onchange="changeDuration()"><option>25</option><option selected>35</option><option>50</option></select> นาที <p><button onclick="pause()">พักชั่วคราว</button><button onclick="resume()">เปิดรับคิวต่อ</button><button onclick="closeDay()">ปิดรับคิววันนี้</button></p></div><div class="card"><h3>คิวรอ / คิวข้าม</h3><div id="queue"></div></div><div class="card"><button onclick="resetDay()">เริ่มวันใหม่ (รีเซ็ตเลขคิว)</button><p><small>ข้อมูลเก็บเฉพาะเบราว์เซอร์เครื่องนี้ ยังไม่มี QR ออนไลน์หรือเครื่องพิมพ์ โปรดอย่าล้างข้อมูลเว็บไซต์ก่อนสำรองข้อมูล</small></p></div><script>
const key='park_queue_v1';let s=JSON.parse(localStorage.getItem(key)||'null')||{day:'',next:1,items:[],current:null,paused:false,closed:false,pauseUntil:null};const today=()=>new Date().toLocaleDateString('en-CA');function save(){localStorage.setItem(key,JSON.stringify(s));render()}function resetDay(){if(!confirm('เริ่มวันใหม่และล้างคิววันนี้?'))return;s={day:today(),next:1,items:[],current:null,paused:false,closed:false,pauseUntil:null};save()}if(s.day!==today()){if(s.items.some(x=>['waiting','serving','skipped'].includes(x.state))&&!confirm('พบคิวจากวันก่อน ต้องการเริ่มวันใหม่หรือไม่?')){}else{s={day:today(),next:1,items:[],current:null,paused:false,closed:false,pauseUntil:null};save()}}function num(n){return String(n).padStart(3,'0')}function issue(){if(s.paused||s.closed)return alert('กำลังพักหรือปิดรับคิว');s.items.push({n:s.next++,state:'waiting',minutes:35,created:Date.now()});save()}function waiting(){return s.items.filter(x=>x.state==='waiting').sort((a,b)=>(a.priority||0)-(b.priority||0)||a.n-b.n)}function start(){if(s.current)return alert('กรุณากดตัดเสร็จหรือข้ามคิวก่อน');let x=waiting()[0];if(!x)return alert('ไม่มีคิวรอ');x.state='serving';s.current=x.n;save()}function finish(){let x=s.items.find(x=>x.n===s.current);if(!x)return alert('ยังไม่มีคิวที่กำลังตัด');x.state='done';s.current=null;save()}function skip(){let x=s.items.find(x=>x.n===s.current);if(!x)return alert('ยังไม่มีคิวที่กำลังตัด');x.state='skipped';s.current=null;save()}function restore(n){let x=s.items.find(x=>x.n===n);if(!x)return;x.state='waiting';x.priority=-1;save()}function cancel(n){if(!confirm('ยกเลิกคิว '+num(n)+'?'))return;let x=s.items.find(x=>x.n===n);x.state='cancelled';if(s.current===n)s.current=null;save()}function changeDuration(){let x=s.items.find(x=>x.n===s.current);if(x){x.minutes=+document.getElementById('duration').value;save()}}function pause(){let m=prompt('คาดว่าจะพักกี่นาที? เช่น 60 หรือ 90','60');if(m===null)return;m=Number(m);if(!Number.isFinite(m)||m<1)return alert('กรุณาใส่จำนวนนาที');s.paused=true;s.pauseUntil=Date.now()+m*60000;save()}function resume(){s.paused=false;s.pauseUntil=null;save()}function closeDay(){if(confirm('ปิดรับคิวใหม่สำหรับวันนี้?')){s.closed=true;save()}}function render(){document.getElementById('status').textContent=s.closed?'ปิดรับคิววันนี้':s.paused?'พักชั่วคราว':'เปิดรับคิว';let cur=s.items.find(x=>x.n===s.current),w=waiting();document.getElementById('summary').innerHTML='<p>กำลังตัด: <b>'+(cur?num(cur.n):'—')+'</b> | รอ '+w.length+' คิว</p>'+(s.paused?'<p>คาดว่ากลับมา '+new Date(s.pauseUntil).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+' น.</p>':'');if(cur)document.getElementById('duration').value=cur.minutes;document.getElementById('queue').innerHTML=s.items.filter(x=>['waiting','skipped'].includes(x.state)).map(x=>'<p>คิว '+num(x.n)+' — '+(x.state==='skipped'?'ข้ามคิว':'รอ')+' <button onclick="cancel('+x.n+')">ยกเลิก</button>'+(x.state==='skipped'?'<button onclick="restore('+x.n+')">กลับมาแล้ว</button>':'')+'</p>').join('')||'<small>ไม่มีคิวรอ</small>'}render();</script></html>
